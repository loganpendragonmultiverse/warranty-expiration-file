name: Feature request
description: Propose a focused offline warranty workflow improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Which local warranty workflow is unsupported? }
    validations: { required: true }
  - type: textarea
    id: privacy
    attributes: { label: Privacy and portability, description: Explain storage, export, and migration impact. }
    validations: { required: true }
