name: Bug report
description: Report a reproducible record, import, or calendar defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Describe the incorrect result without private purchase details. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include sanitized inputs, expected result, and actual result. }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, description: Browser and operating system }
    validations: { required: true }
