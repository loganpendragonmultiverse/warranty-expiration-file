name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Assert deployable output
        run: test -f dist/site/index.html && test -f dist/site/src/core.js && test -f dist/site/src/app.js && test -f dist/site/src/styles.css
